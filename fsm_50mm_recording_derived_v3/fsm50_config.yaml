# Recording-derived 50 mm deterministic FSM candidate.
#
# IMPORTANT EVIDENCE LIMIT:
# The recording audit found no continuous COM/contact telemetry inside the
# version directories.  The v012 command endpoints below are therefore action
# candidates only.  They are never treated as physical transition evidence.
# Every transition is gated by live filtered physics observations, and every
# state remains PENDING_REPLAY until a clean Isaac replay supplies an exact
# event/telemetry interval.

schema_version: fsm50-controller.v1
metadata:
  controller_name: recording-derived-50mm-event-fsm-v3
  obstacle_height_m: 0.050
  provenance_status: PENDING_REPLAY
  physical_success_claim: false
  source_recording_version: v012_20260806_231025_027004_manual
  source_alignment: reports/RECORDING_PHASE_ALIGNMENT_50MM.csv
  source_failure_audit: reports/OLD_FSM_FAILURES_TO_AVOID.md
  source_recording_sha256: 6baec7d52f5a1ce87e594525f179b6a23521ca717a8a06f1361e89f73051d87a
  provenance_note: >-
    Command profiles are candidate v012 endpoints or explicitly identified
    intermediate v012 commands. No state has continuous COM/contact telemetry;
    thresholds are conservative engineering gates and require replay tuning.
  transition_clock: ISAAC_SIMULATION_TIME_ONLY
  transition_policy: PHYSICAL_EVENT_PLUS_DWELL_ONLY
  forbidden_transition_sources:
    - wall_clock
    - recording_step_duration
    - servo_target_arrival_alone
  diagonal_definition:
    FL_RR: [FL, RR]
    FR_RL: [FR, RL]

actuators:
  servo_joints:
    FL: [front_left_hip, front_left_knee]
    FR: [front_right_hip, front_right_knee]
    RL: [rear_left_hip, rear_left_knee]
    RR: [rear_right_hip, rear_right_knee]
  wheel_joints:
    FL: front_left_ankle
    FR: front_right_ankle
    RL: rear_left_ankle
    RR: rear_right_ankle
  servo_max_rate_deg_s: 150.0
  wheel_max_acceleration_rad_s2: 4.0

# Threshold provenance:
# - 2.0 N, 0.5 N, 0.08 s, 0.015 m and 0.08 diagonal hysteresis are
#   inherited from the audited pure support-classifier defaults.
# - remaining values are conservative provisional engineering gates, not
#   successful-recording statistics. They must not be loosened to pass a run.
thresholds:
  provenance_status: PROVISIONAL_ENGINEERING_GUARD_PENDING_REPLAY
  support_load_enter_n: 2.0
  support_load_exit_n: 1.5
  light_support_load_n: 0.5
  unload_load_enter_n: 0.5
  unload_load_exit_n: 0.8
  top_load_enter_n: 2.0
  top_load_exit_n: 1.5
  impulse_preload_enter_n: 3.0
  impulse_release_ratio: 0.55
  support_persistence_s: 0.08
  maximum_contact_drift_m: 0.015
  diagonal_dominance_hysteresis: 0.08
  diagonal_corridor_half_width_m: 0.040
  diagonal_longitudinal_slack: 0.08
  polygon_minimum_margin_m: 0.005
  approach_front_face_distance_m: 0.080
  face_crossing_enter_m: 0.004
  face_crossing_exit_m: -0.002
  minimum_airborne_clearance_m: 0.003
  maximum_lift_to_swing_clearance_drop_m: 0.004
  minimum_com_displacement_m: 0.004
  minimum_com_velocity_m_s: 0.005
  maximum_settle_com_speed_m_s: 0.020
  maximum_roll_deg: 12.0
  maximum_pitch_deg: 18.0
  maximum_angular_speed_deg_s: 30.0
  maximum_settle_angular_speed_deg_s: 8.0
  minimum_joint_limit_margin_deg: 1.0
  maximum_loaded_front_face_rotation_rad: 0.15
  minimum_airborne_dwell_s: 0.05
  minimum_unload_dwell_s: 0.025
  top_load_dwell_s: 0.08
  wheel_stopped_rad_s: 0.08
  minimum_forward_workspace_m: 0.10
  maximum_home_error_deg: 2.0
  final_root_linear_speed_m_s: 0.03
  final_root_angular_speed_deg_s: 5.0

